<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="สู้ๆครับ">
<meta name="theme-color" content="#FBF7F0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>สู้ๆครับ</title>
<style>
  :root{
    --bg:#FBF7F0; --card:#FFFFFF; --ink:#1D2320; --muted:#5C6560;
    /* Green is the working colour and amber marks the goal reached. --accent
       is a truer, deeper green than the teal it started as: white on it reads
       at 6.2:1 rather than 5.1:1, and the Start button was the one place where
       that mattered. --accent-dark is only ever the lip under a button. */
    --accent:#116E4E; --accent-dark:#0C5239; --accent-soft:#E4F0EA;
    --done:#B8761B;
    /* --muted was 4.38:1 on the cream, just under the readable mark, and it is
       the colour every small label uses. Darkened rather than enlarged. */
    --track:#E8E1D6; --line:#DED6C9; --warn-soft:#F9EEDC; --stop:#A8322A;
  }
  /* Kanit, Arno's choice — lighter on the page than Mitr was. Only the Thai
     block is loaded, 21KB for three weights, so digits and Latin still come
     from the phone's own font and the timer keeps its fixed-width figures.
     Served from here rather than from Google, so it works with no signal and
     costs her no privacy. */
  @font-face{font-family:'Kanit'; font-style:normal; font-weight:400;
             font-display:swap; src:url(kanit-thai-400.woff2) format('woff2');
             unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;}
  @font-face{font-family:'Kanit'; font-style:normal; font-weight:600;
             font-display:swap; src:url(kanit-thai-600.woff2) format('woff2');
             unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;}
  @font-face{font-family:'Kanit'; font-style:normal; font-weight:700;
             font-display:swap; src:url(kanit-thai-700.woff2) format('woff2');
             unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;}

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overscroll-behavior:none;}
  body{
    background:var(--bg); color:var(--ink);
    font:400 17px/1.4 'Kanit',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(env(safe-area-inset-top) + 8px) 20px calc(env(safe-area-inset-bottom) + 16px);
    overscroll-behavior:none;
  }
  [hidden]{display:none !important;}
  .wrap{position:relative; z-index:1; width:100%; max-width:420px; margin:auto;
        display:flex; flex-direction:column; gap:20px;}

  /* Opening screen. The photo fills the whole screen behind everything, with a
     scrim at the foot so the button stays readable over a light picture. The
     button sits low so it does not land on her face. */
  /* One pane per photo on a single sideways track. The photo follows her
     finger and iOS supplies the momentum, the rubber-band at the two ends and
     the axis lock. What was here before was a crossfade: it began after the
     swipe had already finished, which is not the same thing as swiping. */
  .photos{position:fixed; inset:0; z-index:0; display:flex;
          overflow-x:auto; overflow-y:hidden; overscroll-behavior:contain;
          scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
          scrollbar-width:none; pointer-events:none;
          opacity:0; transition:opacity .28s ease;}
  .photos::-webkit-scrollbar{display:none;}
  body.landing .photos{opacity:1; pointer-events:auto;}
  /* min-width:0 for the same reason as the strip: without it a flex item will
     not go below a photo's own proportions, so one landscape shot would make
     its pane wider than the screen and put every pane after it off-centre. */
  .pane{flex:0 0 100%; width:100%; min-width:0; height:100%;
        object-fit:cover; display:block; cursor:pointer;
        scroll-snap-align:center; scroll-snap-stop:always;}
  /* The scrim is its own fixed layer rather than part of the track, or it
     would slide away with the photo it is there to darken. */
  .scrim{position:fixed; inset:0; z-index:0; pointer-events:none;
         opacity:0; transition:opacity .28s ease;
         background:linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(0,0,0,.5) 100%);}
  body.landing .scrim{opacity:1;}
  body.landing .wrap{margin:auto 0 0;}
  body.landing.nophotos .wrap{margin:auto;}
  /* Nothing on the opening screen scrolls up and down, so nothing should move
     when she drags that way while aiming sideways at the photos. */
  body.landing{overflow:hidden;}
  .btn.big{padding:22px; font-size:22px;}
  /* Only on the opening screen, and only when a photo is actually behind them:
     the lip stays and a drop shadow is added under it. The white button takes a
     much lighter one — at the same strength as the green it read as a slab
     sitting on the photo rather than a card lying on it. */
  body.landing.hasphoto .btn.primary{box-shadow:inset 0 0 0 2px var(--accent-dark),
                                                0 4px 0 var(--accent-dark), 0 8px 18px rgba(0,0,0,.3);}
  body.landing.hasphoto .btn.ghost{box-shadow:inset 0 0 0 2px var(--line), 0 4px 0 var(--line),
                                              0 3px 10px rgba(0,0,0,.14);}
  body.landing.hasphoto .btn.primary:active{box-shadow:inset 0 0 0 2px var(--accent-dark),
                                                       0 1px 0 var(--accent-dark), 0 5px 12px rgba(0,0,0,.26);}
  body.landing.hasphoto .btn.ghost:active{box-shadow:inset 0 0 0 2px var(--line), 0 1px 0 var(--line),
                                                     0 2px 7px rgba(0,0,0,.12);}

  /* One dot per photo, so it is plain there are more to swipe to. */
  .dots{display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin:0 0 2px;}
  .dots i{width:7px; height:7px; border-radius:50%; background:var(--track);
          transition:background .2s ease;}
  .dots i.on{background:var(--accent);}
  body.hasphoto .dots i{background:rgba(255,255,255,.45);}
  body.hasphoto .dots i.on{background:#fff;}

  /* ---- calendar: one mark per day, nothing else ---- */
  .calhead{display:flex; align-items:center; justify-content:space-between;}
  .calhead .m{font-size:19px; font-weight:600;}
  .navbtn{background:none; border:0; font-family:inherit; font-size:26px; line-height:1;
          color:var(--muted); padding:6px 16px; touch-action:manipulation; cursor:pointer;}
  .navbtn[disabled]{opacity:.22;}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  /* No tracking anywhere Thai lands: the marks sit over and under the letters
     and belong to them, so pulling the letters apart pulls the word apart. */
  .dow{text-align:center; font-size:13px; font-weight:600; line-height:1.5;
       color:var(--muted);}
  .day{width:38px; height:38px; margin:0 auto; border-radius:50%;
       display:flex; align-items:center; justify-content:center;
       font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums;}
  .day.blank{visibility:hidden;}
  .day.done{background:var(--accent); color:#fff; font-weight:600;}
  .day.miss{box-shadow:inset 0 0 0 2px var(--track); color:var(--muted);}
  .day.today{box-shadow:inset 0 0 0 2px var(--done); font-weight:600;}
  .legend{display:flex; gap:18px; justify-content:center; margin:0;
          font-size:15px; color:var(--muted);}
  .legend i{display:inline-block; width:12px; height:12px; border-radius:50%;
            margin-right:6px; vertical-align:-1px;}
  .legend .yes i{background:var(--accent);}
  .legend .no i{box-shadow:inset 0 0 0 2px var(--track);}

  /* ---- one page at a time, crossfading ---- */
  .page{display:flex; flex-direction:column; gap:20px;}
  .page > *{opacity:0; transform:translateY(8px);
            transition:opacity .28s ease, transform .28s ease;}
  .page.on > *{opacity:1; transform:none;}
  .page.on > :nth-child(1){transition-delay:.02s;}
  .page.on > :nth-child(2){transition-delay:.07s;}
  .page.on > :nth-child(3){transition-delay:.12s;}
  .page.on > :nth-child(4){transition-delay:.17s;}
  .page.on > :nth-child(5){transition-delay:.22s;}
  .page.on > :nth-child(6){transition-delay:.27s;}
  .page.on > :nth-child(7){transition-delay:.32s;}

  .q{margin:0; text-align:center; font-size:24px; font-weight:600; line-height:1.4;}

  /* ---- wheel: 3 rows of 44px ---- */
  .pickrow{display:flex; gap:10px; align-items:stretch;}
  .wheelbox{position:relative; height:132px; background:var(--card);
            border:1px solid var(--line); border-radius:18px; overflow:hidden;}
  .pickrow .wheelbox{flex:1 1 0; min-width:0;}
  /* A readout, not a control. Deliberately flat on the page colour with no fill
     and no ring: every button here is either solid teal or white with a ring, so
     this cannot be mistaken for one. Inert to touch as well as to the eye. */
  /* Tapping this goes back to step 1, so it wears the same white-with-a-ring
     as Back and Calendar — the shape she already knows means "you can press
     this", and never the solid teal that means "this is the action". */
  .lenbox{flex:0 0 33%; padding:0; font-family:inherit; color:inherit;
          background:var(--card); border:0; box-shadow:inset 0 0 0 2px var(--line);
          border-radius:18px; touch-action:manipulation; cursor:pointer;
          -webkit-appearance:none; appearance:none;
          display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .lenbox:active{background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent);}
  .lenbox .lab{font-size:17px; font-weight:600; line-height:1.5; color:var(--muted);}
  .lenbox .v{margin-top:5px; font-size:23px; font-weight:700; line-height:1.25;
             color:var(--ink); font-variant-numeric:tabular-nums;}
  /* ชม. is the unit, not the answer — it stays regular wherever the number
     around it is set bold. */
  .u{font-weight:400;}
  .band{position:absolute; left:8px; right:8px; top:44px; height:44px;
        background:var(--accent-soft); border-radius:12px; pointer-events:none;}
  .scroller{position:relative; height:100%; overflow-y:scroll;
            scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;
            padding:44px 0; scrollbar-width:none;}
  .scroller::-webkit-scrollbar{display:none;}
  .row{height:44px; display:flex; align-items:center; justify-content:center;
       scroll-snap-align:center; font-size:19px; color:var(--muted);
       font-variant-numeric:tabular-nums; white-space:nowrap;}
  .row.sel{color:var(--ink); font-weight:600; font-size:23px;}

  /* the finish time is the thing she is really choosing, so it gets weight */
  .finish{background:var(--accent-soft); border-radius:16px; padding:13px 12px 15px;
          text-align:center;}
  .finish .lab{display:block; font-size:18px; font-weight:600; line-height:1.5;
               color:var(--accent); opacity:.9;}
  .finish .t{display:block; margin-top:5px; font-size:32px; font-weight:700;
             letter-spacing:-.02em; line-height:1; color:var(--accent);
             font-variant-numeric:tabular-nums;}

  /* ---- arc + readout ---- */
  .gauge{position:relative; width:100%;}
  .arc{display:block; width:100%; height:auto;}
  .arc path{fill:none; stroke-width:14; stroke-linecap:round;}
  .arc-track{stroke:var(--track);}
  .arc-fill{stroke:var(--accent); transition:stroke-dashoffset .4s ease, stroke .4s ease;}
  body.done .arc-fill{stroke:var(--done);}

  .readout{position:absolute; left:8%; right:8%; bottom:8px; text-align:center;}
  .cap{font-size:19px; font-weight:600; line-height:1.5;
       color:var(--muted); min-height:29px;}
  .big{margin-top:6px; font-size:44px; font-weight:600; letter-spacing:-.02em;
       font-variant-numeric:tabular-nums; line-height:1;}
  .big.time{font-size:40px;}
  .sub{margin-top:8px; font-size:16px; color:var(--muted);}
  .nb{white-space:nowrap;}
  body.done .cap{color:var(--done);}
  body.done .sub{color:var(--done); font-weight:600;}

  /* ---- buttons ---- */
  /* A solid lip underneath, so a button looks like something that goes down
     when it is pressed rather than a coloured rectangle. Pressing moves it
     onto the lip — 3px down, shadow down to 1px — so the pair keeps the same
     footprint and only the button appears to sink.
     Both buttons are built the same way: a 2px ring inside the edge and a lip
     of the same colour beneath it — the line colour on the white one, the dark
     green on the green one.
     Calendar takes the dark green for its label rather than grey, because grey
     on white reads as switched off, which is the opposite of what a button she
     is meant to press should say. */
  .btn{width:100%; padding:19px; border:0; border-radius:16px;
       font-size:19px; font-weight:600; font-family:inherit;
       touch-action:manipulation; cursor:pointer;
       transition:transform .06s ease, box-shadow .06s ease;}
  .btn.primary{background:var(--accent); color:#fff;
               box-shadow:inset 0 0 0 2px var(--accent-dark), 0 4px 0 var(--accent-dark);}
  .btn.ghost{background:var(--card); color:var(--accent-dark);
             box-shadow:inset 0 0 0 2px var(--line), 0 4px 0 var(--line);}
  .btn.primary:active{transform:translateY(3px);
                      box-shadow:inset 0 0 0 2px var(--accent-dark), 0 1px 0 var(--accent-dark);}
  .btn.ghost:active{transform:translateY(3px);
                    box-shadow:inset 0 0 0 2px var(--line), 0 1px 0 var(--line);}
  .btn:active{filter:brightness(.97);}
  .actions{display:flex; gap:10px;}
  .actions .btn{flex:1 1 0;}
  .actions .btn.back{flex:0 0 34%;}

  /* Change is an escape hatch, not an action. Small, quiet, off to one side —
     still a 44px-tall target, just visually recessive. */
  .changerow{display:flex; justify-content:center; gap:4px;}
  .btn.quiet{width:auto; padding:12px 20px; font-size:15px; font-weight:500;
             background:none; color:var(--muted); box-shadow:none;
             text-decoration:underline; text-underline-offset:3px;
             text-decoration-color:var(--line);}
  /* Giving up and owning up are the two ways a fast ends badly. They stay quiet
     and small — she is never pushed away from them — but they are not the same
     kind of thing as Change, and should not look like it. */
  .btn.quiet.stop{color:var(--stop); text-decoration-color:rgba(168,50,42,.35);}

  .confirm{display:flex; flex-direction:column; gap:12px;}
  .ask{margin:0; padding:18px 16px; border-radius:16px; background:var(--warn-soft);
       text-align:center; font-size:20px; line-height:1.35; font-weight:600;
       color:var(--ink);}

  /* no panel — it carries on weight and size alone */
  .quote{margin:0; padding:0 8px; text-align:center; font-size:20px; line-height:1.4;
         font-weight:700; color:var(--ink); font-style:italic; letter-spacing:-.01em;}

  /* Everything is set and the fast has not begun. Nothing to do but wait. */
  .watch{display:flex; justify-content:center;}
  .watch svg{width:64px; height:72px;}
  .watch .case{fill:var(--accent-soft); stroke:var(--accent); stroke-width:4;}
  .watch .part{fill:none; stroke:var(--accent); stroke-width:4;
               stroke-linecap:round; stroke-linejoin:round;}

  /* The reward for seeing a fast through. Sparse on purpose — more to come. */
  .tick{display:flex; justify-content:center;}
  .tick svg{width:140px; height:140px;}
  .tick-ring{fill:var(--accent-soft); stroke:none;}
  .tick-mark{fill:none; stroke:var(--accent); stroke-width:11;
             stroke-linecap:round; stroke-linejoin:round;
             stroke-dasharray:70; stroke-dashoffset:70;
             animation:draw .45s .2s cubic-bezier(.65,0,.35,1) forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .wd{margin:0; text-align:center; font-size:30px; font-weight:700; line-height:1.35;}
  .wdsub{margin:0; text-align:center; font-size:17px; line-height:1.4; color:var(--muted);}

  /* ---- the small button in the top corner ---- */
  /* Two buttons share the same corner, and each belongs to one screen: the cog
     to the opening screen, the calendar to a fast that is set or under way.
     Never both at once — the app shows one thing at a time. */
  .topbtn{position:fixed; z-index:2; top:calc(env(safe-area-inset-top) + 6px); right:10px;
       width:44px; height:44px; padding:0; border:0; background:none; cursor:pointer;
       touch-action:manipulation; display:flex; align-items:center; justify-content:center;
       opacity:0; pointer-events:none; transition:opacity .28s ease;}
  body.landing .cog, body.timer .calview{opacity:1; pointer-events:auto;}
  body.landing .cog:active, body.timer .calview:active{opacity:.5;}
  .topbtn svg{width:25px; height:25px; fill:none; stroke:var(--muted);
           stroke-width:2.2; stroke-linecap:round;}
  /* Over a photo it has no scrim behind it, so it goes white with a soft shadow
     — readable on a dark sky or a bright beach alike. */
  body.landing.hasphoto .cog svg{stroke:#fff; filter:drop-shadow(0 2px 7px rgba(0,0,0,.6));}

  .hint{margin:0; text-align:center; font-size:16px; line-height:1.5; color:var(--muted);}
  .setgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .thumb{position:relative; aspect-ratio:3/4; min-height:98px;
         border-radius:14px; overflow:hidden; background:var(--track);}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  /* Removing is a plain tap with no question asked. The photo is still in her
     camera roll, so nothing is lost and she can add it back. */
  .thumb .x{position:absolute; top:5px; right:5px; width:30px; height:30px; padding:0;
            border:0; border-radius:50%; background:rgba(0,0,0,.55); color:#fff;
            font:600 18px/1 inherit; cursor:pointer; touch-action:manipulation;
            display:flex; align-items:center; justify-content:center;}

  /* ---- the strip of photos under the timer ---- */
  /* Small on purpose. It is a reminder of why she is doing this, sitting below
     the fast rather than competing with it. Native horizontal scrolling, so it
     gets iOS momentum and rubber-banding for free. */
  .strip{display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory;
         -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px;}
  .strip::-webkit-scrollbar{display:none;}
  /* width AND min-width both matter: without min-width a flex item is not
     allowed to go below its own natural proportions, so a landscape photo
     shoulders its way past 88px and knocks the whole strip out of step. */
  .strip img{flex:0 0 88px; width:88px; min-width:0; height:116px;
             object-fit:cover; border-radius:14px;
             scroll-snap-align:start; background:var(--track);
             cursor:pointer; touch-action:manipulation;}
  .strip img:active{filter:brightness(.92);}

  /* ---- one photo, opened up ---- */
  /* Whole-photo, not cropped: she opened it to look at it. Black behind, so
     nothing competes with it, and every way out is a tap. */
  .viewer{position:fixed; inset:0; z-index:10; background:#000;
          display:flex; align-items:center; justify-content:center;
          padding:calc(env(safe-area-inset-top) + 56px) 0 calc(env(safe-area-inset-bottom) + 34px);
          opacity:0; transition:opacity .22s ease; touch-action:none;}
  .viewer.on{opacity:1;}
  /* touch-action:none above hands every finger to us, because the pinch, the
     drag and the swipe between photos all have to be told apart in one place.
     .snap is only on for the eased return to fit — never during a gesture,
     where the photo must track the fingers exactly. */
  .viewer img{max-width:100%; max-height:100%; object-fit:contain; display:block;
              transform-origin:center center;}
  .viewer img.snap{transition:transform .22s ease;}
  .vclose{position:absolute; top:calc(env(safe-area-inset-top) + 6px); right:12px;
          width:44px; height:44px; padding:0; border:0; border-radius:50%;
          background:rgba(255,255,255,.16); color:#fff;
          font:300 27px/1 inherit; cursor:pointer; touch-action:manipulation;
          display:flex; align-items:center; justify-content:center;}
  .vclose:active{background:rgba(255,255,255,.3);}
  .vdots{position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 12px);
         display:flex; flex-wrap:wrap; justify-content:center; gap:9px; padding:0 20px;}
  .vdots i{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.38);}
  .vdots i.on{background:#fff;}

  @keyframes swapin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .swapin{animation:swapin .25s ease;}

  @media (prefers-reduced-motion: reduce){
    .page > *{transition-duration:.01ms; transform:none;}
    .photos, .scrim, .topbtn, .viewer, .viewer img.snap, .btn{transition:none;}
    .tick-mark{animation:none; stroke-dashoffset:0;}
    .arc-fill{transition:none;}
  }
</style>
</head>
<body>
<div class="photos" id="photos" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<button class="topbtn cog" id="btnCog" aria-label="ตั้งค่า">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="7.4"/>
    <circle cx="12" cy="12" r="2.7"/>
    <path d="M19.4 12 L22.2 12 M17.23 6.77 L19.21 4.79 M12 4.6 L12 1.8
             M6.77 6.77 L4.79 4.79 M4.6 12 L1.8 12 M6.77 17.23 L4.79 19.21
             M12 19.4 L12 22.2 M17.23 17.23 L19.21 19.21"/>
  </svg>
</button>
<button class="topbtn calview" id="btnCalTop" aria-label="ดูปฏิทิน">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="3.2" y="5" width="17.6" height="15.8" rx="2.6"/>
    <path d="M3.2 9.9 H20.8 M8 2.9 V6.7 M16 2.9 V6.7"/>
  </svg>
</button>
<input type="file" id="pick" accept="image/*" multiple hidden>

<div class="viewer" id="viewer" hidden>
  <img id="viewerImg" alt="">
  <button class="vclose" id="viewerClose" aria-label="ปิด">&times;</button>
  <div class="vdots" id="viewerDots"></div>
</div>

<div class="wrap">

  <!-- opening screen -->
  <section class="page" id="pgHome" hidden>
    <div class="dots" id="dots" hidden></div>
    <button class="btn primary big" id="btnStart">เริ่ม</button>
    <button class="btn ghost" id="btnCal">ปฏิทิน</button>
  </section>

  <!-- calendar -->
  <section class="page" id="pgCal" hidden>
    <div class="calhead">
      <button class="navbtn" id="calPrev" aria-label="เดือนก่อนหน้า">&lsaquo;</button>
      <span class="m" id="calMonth"></span>
      <button class="navbtn" id="calNext" aria-label="เดือนถัดไป">&rsaquo;</button>
    </div>

<script src="quotes.js"></script>
<script src="photos.js"></script>
<script>
(function(){
  'use strict';

  var KEY='fastingApp.v1', STEP=30, ROW=44, ARC=Math.PI*100;
  var LEN_MIN=60, LEN_MAX=1380, LEN_STEP=60; // fast length: whole hours, 1h to 23h

  // ---------- time helpers (device clock only) ----------
  function toMins(hhmm){ var p=hhmm.split(':'); return (+p[0])*60 + (+p[1]); }
  function toHHMM(m){ m=((m%1440)+1440)%1440;
    return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
  function snapHHMM(hhmm){ return toHHMM(Math.round(toMins(hhmm)/STEP)*STEP); }
  function snapLen(m){ m=Math.round(m/LEN_STEP)*LEN_STEP; return Math.max(LEN_MIN, Math.min(LEN_MAX, m)); }

  // 24-hour, the way a clock reads in Thailand. Still the device's own clock
  // and nothing else — no timeZone option, so it follows her phone.
  function labelDate(d){
    return d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false});
  }
  function label(mins){
    var d=new Date();
    d.setHours(Math.floor(((mins%1440)+1440)%1440/60), mins%60, 0, 0);
    return labelDate(d);
  }
  function lenLabel(m){
    var h=Math.floor(m/60), mm=m%60;
    return mm ? h+' ชม. '+mm+' นาที' : h+' ชม.';
  }
  // The same thing with the unit marked, for the two places set in bold: the
  // number is what she is choosing, the unit is only saying what it is.
  function lenLabelHTML(m){
    var h=Math.floor(m/60), mm=m%60;
    var out=h+' <span class="u">ชม.</span>';
    if(mm) out+=' '+mm+' <span class="u">นาที</span>';
    return out;
  }
  function hms(ms){
    var s=Math.max(0,Math.floor(ms/1000));
    return Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }
  function durText(ms){
    var m=Math.floor(ms/60000);
    if(m<60) return m+' นาที';
    var h=Math.floor(m/60), r=m%60;
    return h+' ชม.'+(r? ' '+r+' นาที' : '');
  }
  function spanMins(a,b){ var d=toMins(b)-toMins(a); if(d<=0) d+=1440; return d; }

  // ---------- state ----------
  // draftLen / draftStart = what the two wheels show.
  // fast = ONE scheduled fast, committed by Set. It never repeats: once it is
  //        over she sets a new one the next day.
  function migrate(o){
    if(!o) return null;
    if(o.version===5) return o;
    // v4 is the same shape plus the day log, so a fast in flight survives.
    if(o.version===4)
      return { version:5, draftLen:o.draftLen, draftStart:o.draftStart, fast:o.fast,
               quoteIdx:o.quoteIdx, log:{} };
    if(o.version===3 || o.version===2)
      return { version:5, draftLen:spanMins(o.draftStart,o.draftFinish), draftStart:o.draftStart, fast:null, log:{} };
    if(o.version===1)
      return { version:5, draftLen:spanMins(o.startHHMM,o.finishHHMM), draftStart:o.startHHMM, fast:null, log:{} };
    return null;
  }
  var migrated=false;
  function load(){
    try{
      var raw=localStorage.getItem(KEY); if(!raw) return null;
      var parsed=JSON.parse(raw), out=migrate(parsed);
      if(out && parsed.version!==5) migrated=true;
      return out;
    }catch(e){ return null; }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  var state = load() || { version:5, draftLen:840, draftStart:'17:00', fast:null, log:{} };
  if(!state.log || typeof state.log!=='object') state.log={};
  state.draftStart = snapHHMM(state.draftStart);   // wheels only move in STEP increments
  state.draftLen   = snapLen(state.draftLen);

  // The chosen line is held in state, so it stays put through the once-a-second
  // repaint, and is rolled only when she opens the app or brings it back to the
  // front. Never the same line twice running. Absent quotes.js, no quote shows.
  function quoteList(){ var l=window.QUOTES; return (l && l.length) ? l : null; }
  function rollQuote(){
    var l=quoteList(); if(!l) return;
    var n=l.length, i=state.quoteIdx, j=0;
    if(n>1){ do{ j=Math.floor(Math.random()*n); }while(j===i); }
    state.quoteIdx=j; save();
  }
  // Her own photos. They sit side by side on one sideways track across the
  // opening screen, so a swipe drags the next one in under her finger. A
  // missing or misspelt file is quietly dropped from the run rather than
  // leaving a dark gap she can swipe into.
  //
  // Two sources, one run. The ones named in photos.js ship with the app; the
  // ones she adds herself live on the phone in IndexedDB, because there is no
  // server to put them on. Her own go on the end, so adding one never shuffles
  // the others out from under her.
  var bundled  = (window.PHOTOS || []).slice(),
      mine     = [],     // [{id, url}] — hers, as object URLs onto the stored files
      photos   = bundled.slice(),
      photoAt  = -1,     // index the track has settled on, -1 = none yet
      photosReady = false;

  function rebuildPhotos(){
    photos = bundled.concat(mine.map(function(m){ return m.url; }));
    // Until she has added any, the opening screen is just the two buttons, and
    // they belong in the middle rather than stranded at the foot of an empty
    // screen waiting for a photo that is not there.
    document.body.classList.toggle('nophotos', !photos.length);
    stripDirty = true;
    panesDirty = true;
  }
  rebuildPhotos();

  // ---------- her own photos, stored on the phone ----------
  // localStorage is the wrong shelf for these: it holds text, so a photo would
  // have to be base64 and the whole 5MB budget is gone after one. IndexedDB
  // holds the file itself and has room for hundreds. Like the fast log, it
  // survives indefinitely because this is a home-screen app — but it lives only
  // on her phone, so a photo she adds is hers alone and never leaves the device.
  var DBNAME='fastingPhotos', STORE='photos', DB=null, MAXPX=1400;

  function openDB(cb){
    if(DB) return cb(DB);
    var r;
    try{ r=indexedDB.open(DBNAME,1); }catch(e){ return cb(null); }
    r.onupgradeneeded=function(){
      try{ r.result.createObjectStore(STORE,{keyPath:'id'}); }catch(e){}
    };
    r.onsuccess=function(){ DB=r.result; cb(DB); };
    r.onerror=r.onblocked=function(){ cb(null); };
  }
  function store(mode, cb){
    openDB(function(db){
      if(!db) return cb(null);
      try{ cb(db.transaction(STORE,mode).objectStore(STORE)); }catch(e){ cb(null); }
    });
  }
  function loadMine(cb){
    store('readonly', function(st){
      if(!st) return cb();
      var r;
      try{ r=st.getAll(); }catch(e){ return cb(); }
      r.onsuccess=function(){
        var rows=r.result||[];
        rows.sort(function(a,b){ return (a.added||0)-(b.added||0); });
        for(var i=0;i<rows.length;i++){
          try{ mine.push({id:rows[i].id, url:URL.createObjectURL(rows[i].blob)}); }catch(e){}
        }
        cb();
      };
      r.onerror=function(){ cb(); };
    });
  }
  function putPhoto(rec, cb){
    store('readwrite', function(st){
      if(!st) return cb(false);
      var r;
      try{ r=st.put(rec); }catch(e){ return cb(false); }
      r.onsuccess=function(){ cb(true); };
      r.onerror=function(){ cb(false); };
    });
  }
  function delPhoto(id, cb){
    store('readwrite', function(st){
      if(!st) return cb();
      var r;
      try{ r=st.delete(id); }catch(e){ return cb(); }
      r.onsuccess=r.onerror=function(){ cb(); };
    });
  }

  // A photo off an iPhone is 3-4MB, and she might add dozens. Shrinking to
  // 1400px on the long edge takes each one to a couple of hundred KB, which
  // opens instantly and still looks right on any screen she owns. Picking from
  // the photo library also hands us a JPEG even when the original is HEIC, so
  // there is no format to wrestle with.
  function shrink(file, cb){
    var url, img=new Image();
    try{ url=URL.createObjectURL(file); }catch(e){ return cb(null); }
    img.onload=function(){
      var w=img.naturalWidth, h=img.naturalHeight;
      if(!w || !h){ URL.revokeObjectURL(url); return cb(null); }
      var k=Math.min(1, MAXPX/Math.max(w,h)), c=document.createElement('canvas');
      c.width=Math.round(w*k); c.height=Math.round(h*k);
      try{ c.getContext('2d').drawImage(img,0,0,c.width,c.height); }
      catch(e){ URL.revokeObjectURL(url); return cb(null); }
      URL.revokeObjectURL(url);
      if(!c.toBlob) return cb(null);
      c.toBlob(function(b){ cb(b||null); }, 'image/jpeg', .82);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); cb(null); };
    img.src=url;
  }

  // One at a time, so a fistful of photos cannot spike memory. A file that will
  // not decode is skipped rather than allowed to break the run.
  function importFiles(list, done){
    var files=[].slice.call(list||[]), added=0, i=0;
    (function next(){
      if(i>=files.length) return done(added, files.length);
      shrink(files[i++], function(blob){
        if(!blob) return next();
        var rec={ id:String(Date.now())+'-'+Math.random().toString(36).slice(2,8),
                  blob:blob, added:Date.now() };
        putPhoto(rec, function(ok){
          if(ok){
            try{ mine.push({id:rec.id, url:URL.createObjectURL(blob)}); added++; }catch(e){}
          }
          next();
        });
      });
    })();
  }

  function photoIdx(){
    var n=photos.length; if(!n) return 0;
    var i=state.photoIdx;
    return (typeof i==='number' && i>=0 && i<n) ? i : 0;
  }
  // A different photo from the one she saw last time, never the same twice running.
  function rollPhoto(){
    var n=photos.length; if(n<2) return;
    var i=photoIdx(), j=i;
    do{ j=Math.floor(Math.random()*n); }while(j===i);
    state.photoIdx=j; save();
  }
  var panesDirty=true;
  function buildPanes(){
    var out='';
    for(var i=0;i<photos.length;i++) out+='<img class="pane" src="'+photos[i]+'" alt="">';
    elPhotoWrap.innerHTML=out;
    panesDirty=false;
  }
  function paneW(){ return elPhotoWrap.clientWidth || window.innerWidth || 1; }

  function clearPhoto(){
    elPhotoWrap.hidden=true; elScrim.hidden=true; elDots.hidden=true;
    // Empty the track too, or it keeps a run of dead panes pointing at photos
    // she has just removed.
    elPhotoWrap.innerHTML=''; panesDirty=true;
    document.body.classList.remove('hasphoto');
    photoAt=-1;
  }
  function paintDots(){
    if(photos.length<2){ elDots.hidden=true; return; }
    var out='';
    for(var i=0;i<photos.length;i++) out+='<i'+(i===photoAt?' class="on"':'')+'></i>';
    elDots.innerHTML=out; elDots.hidden=false;
  }
  // Puts a photo on screen outright. This is for arriving at the opening
  // screen, not for swiping — while she swipes, the track is in charge and
  // the scroll listener in wirePhotoTrack() reads back where it stopped.
  function showPhoto(i){
    var n=photos.length;
    if(!n){ clearPhoto(); return; }
    elPhotoWrap.hidden=false; elScrim.hidden=false;
    document.body.classList.add('hasphoto');
    if(panesDirty) buildPanes();
    i=((i%n)+n)%n;
    elPhotoWrap.scrollLeft = i*paneW();
    photoAt=i; state.photoIdx=i; save();
    paintDots();
  }
  // Nudge the track a whole pane along, for a swipe that began somewhere the
  // track could not feel it.
  function scrollPane(i){
    var n=photos.length; if(n<2) return;
    i=Math.max(0, Math.min(n-1, i));
    var x=i*paneW();
    try{ elPhotoWrap.scrollTo({left:x, behavior:'smooth'}); }
    catch(err){ elPhotoWrap.scrollLeft=x; }
  }
  // Wired further down, once the elements it needs have been looked up.
  var settleT=0;
  function wirePhotoTrack(){
    // One that will not load leaves the run and takes its pane with it, so she
    // never swipes into a black rectangle. One fewer each time, so this ends.
    elPhotoWrap.addEventListener('error', function(e){
      var img=e.target;
      if(!img || img.tagName!=='IMG') return;
      var bad=photos.indexOf(img.getAttribute('src'));
      if(bad>-1) photos.splice(bad,1);
      img.remove();
      if(!photos.length){ clearPhoto(); return; }
      if(photoAt>=photos.length) photoAt=photos.length-1;
      paintDots();
    }, true);
    // Which one she has landed on. The dots follow the finger; the write to
    // storage waits until she stops, so a fast flick through eight photos is
    // one save and not eight.
    elPhotoWrap.addEventListener('scroll', function(){
      var i=Math.round(elPhotoWrap.scrollLeft/paneW());
      if(i<0 || i>=photos.length || i===photoAt) return;
      photoAt=i; paintDots();
      clearTimeout(settleT);
      settleT=setTimeout(function(){ state.photoIdx=photoAt; save(); }, 400);
    });
    // Tapping the photo opens it up, the same as tapping one in the strip.
    elPhotoWrap.addEventListener('click', function(){
      if(Date.now()-swipedAt < 500) return;
      if(photos.length) openViewer(photoAt<0 ? 0 : photoAt);
    });
  }

  // A swipe that starts ON the photo is the track's own business and never
  // reaches here. This is for one that starts on the buttons, which is most of
  // the bottom of the screen and has nothing under the finger to scroll — she
  // would otherwise get nothing at all. The tap that would follow is swallowed
  // below, so swiping across Start never starts a fast.
  var swipeX=0, swipeY=0, swiping=false, swipedAt=0;
  document.addEventListener('pointerdown', function(e){
    var t=e.target;
    swiping = !viewerOpen()                        // the viewer runs its own
              && document.body.classList.contains('landing')
              && photos.length>1
              && !(t && t.closest && t.closest('.photos'));
    swipeX=e.clientX; swipeY=e.clientY;
  });
  document.addEventListener('pointercancel', function(){ swiping=false; });
  document.addEventListener('pointerup', function(e){
    if(!swiping) return;
    swiping=false;
    var dx=e.clientX-swipeX, dy=e.clientY-swipeY;
    if(Math.abs(dx)<45 || Math.abs(dx)<Math.abs(dy)*1.5) return;
    swipedAt=Date.now();
    scrollPane(photoAt + (dx<0 ? 1 : -1));
  });
  document.addEventListener('click', function(e){
    if(Date.now()-swipedAt < 500){ e.preventDefault(); e.stopPropagation(); }
  }, true);

  function currentQuote(){
    var l=quoteList(); if(!l) return null;
    var i=state.quoteIdx;
    return l[(typeof i==='number' && i>=0 && i<l.length) ? i : 0];
  }

  // A fast belongs to the day it STARTED on — she thinks of it as "Thursday's
  // fast" even though it runs into Friday morning, so an overnight fast marks
  // the evening she began it, not the morning it ended.
  //
  // The day itself runs 4am to 4am rather than midnight to midnight. Without
  // that, a fast begun at half past midnight would be filed under the new date
  // on the clock, when to her it is still the night before. Moving the border
  // is one rule with no special cases; it needs no notion of what counts as
  // "morning" and leaves a daytime fast exactly where it belongs.
  // Device clock only.
  var DAY_EDGE=4;                                    // hours past midnight
  function dayDate(ms){ return new Date(ms - DAY_EDGE*3600000); }
  function dayKey(ms){
    var d=dayDate(ms);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
                          +'-'+String(d.getDate()).padStart(2,'0');
  }
  function markDay(ms, ok){
    var k=dayKey(ms);
    if(state.log[k]===ok) return;
    state.log[k]=ok; save();
  }
  function unmarkDay(ms){
    var k=dayKey(ms);
    if(!(k in state.log)) return;
    delete state.log[k]; save();
  }

  function phase(){
    var f=state.fast;
    if(!f) return 'unset';
    var now=Date.now();
    if(now < f.startsAt) return 'armed';
    if(now < f.endsAt)   return 'fasting';
    return 'complete';
  }

  // ---------- wheels ----------
  function buildWheel(el, labels, getIdx, setIdx){
    var f=document.createDocumentFragment();
    for(var i=0;i<labels.length;i++){
      var r=document.createElement('div');
      r.className='row'; r.innerHTML=labels[i];   // labels are ours: digits and units
      f.appendChild(r);
    }
    el.appendChild(f);

    var rows=el.children, cur=-1, timer=null;
    function mark(i){
      if(i===cur) return;
      if(rows[cur]) rows[cur].classList.remove('sel');
      if(rows[i]) rows[i].classList.add('sel');
      cur=i;
    }
    function idx(){ return Math.max(0, Math.min(rows.length-1, Math.round(el.scrollTop/ROW))); }

    el.addEventListener('scroll', function(){
      if(!el.clientHeight) return;            // hidden page: scrollTop is meaningless
      mark(idx());
      clearTimeout(timer);
      timer=setTimeout(function(){
        if(!el.clientHeight) return;
        setIdx(idx()); save(); render();
      },120);
    }, {passive:true});

    return function sync(){ var i=getIdx(); el.scrollTop=i*ROW; mark(i); };
  }

  var lenLabels=[], lenIdxToMins=[];
  for(var m=LEN_MIN; m<=LEN_MAX; m+=LEN_STEP){ lenLabels.push(lenLabelHTML(m)); lenIdxToMins.push(m); }
  var syncLen = buildWheel(document.getElementById('lenCol'), lenLabels,
    function(){ return (state.draftLen-LEN_MIN)/LEN_STEP; },
    function(i){ state.draftLen=lenIdxToMins[i]; });

  var timeLabels=[];
  for(var t=0; t<1440; t+=STEP) timeLabels.push(label(t));
  var syncStart = buildWheel(document.getElementById('startCol'), timeLabels,
    function(){ return toMins(state.draftStart)/STEP; },
    function(i){ state.draftStart=toHHMM(i*STEP); });

  // ---------- elements ----------
  var elFinishTime=document.getElementById('finishTime'),
      elLenChip=document.getElementById('lenChip'),
      elCap=document.getElementById('cap'),
      elBig=document.getElementById('big'),
      elSub=document.getElementById('sub'),
      elFill=document.getElementById('fill'),
      elQuote=document.getElementById('quote'),
      elChangeRow=document.getElementById('changeRow'),
      elConfirm=document.getElementById('confirmRow'),
      elAsk=document.getElementById('ask'),
      elChange=document.getElementById('btnChange'),
      elGive=document.getElementById('btnGive'),
      elYes=document.getElementById('btnYes'),
      elEatBox=document.getElementById('eatBox'),
      elEatTime=document.getElementById('eatTime'),
      elDoneSub=document.getElementById('doneSub'),
      elWatch=document.getElementById('watch'),
      elStart=document.getElementById('btnStart'),
      elCancel=document.getElementById('btnCancel'),
      elPhotoWrap=document.getElementById('photos'),
      elScrim=document.getElementById('scrim'),
      elViewClose=document.getElementById('viewerClose'),
      elDots=document.getElementById('dots'),
      elStrip=document.getElementById('strip'),
      elViewer=document.getElementById('viewer'),
      elViewImg=document.getElementById('viewerImg'),
      elViewDots=document.getElementById('viewerDots'),
      elPick=document.getElementById('pick'),
      elMineGrid=document.getElementById('mineGrid'),
      elSetHint=document.getElementById('setHint'),
      elCalMonth=document.getElementById('calMonth'),
      elCalGrid=document.getElementById('calGrid'),
      elCalNext=document.getElementById('calNext');

  elFill.style.strokeDasharray=ARC;

  // ---------- render ----------
  function render(){
    elFinishTime.textContent = label(toMins(state.draftStart)+state.draftLen);
    elLenChip.innerHTML      = lenLabelHTML(state.draftLen);

    var f=state.fast, p=phase(), progress=0, done=false;
    if(p==='fasting'){
      var total=f.endsAt-f.startsAt, elapsed=Date.now()-f.startsAt;
      progress=Math.min(1, elapsed/total);
      elCap.textContent='ผ่านไปแล้ว';
      elBig.textContent=hms(elapsed); elBig.classList.remove('time');
      elSub.textContent='จาก '+lenLabel(Math.round(total/60000));
    }else if(p==='armed'){
      elCap.textContent='จะเริ่มเมื่อ';                     // no counter before it begins
      elBig.textContent=labelDate(new Date(f.startsAt)); elBig.classList.add('time');
        // Two phrases, each kept whole. Thai has no spaces inside a phrase, so
      // left alone the browser breaks it wherever its dictionary says it may —
      // which on a narrow screen, or with iOS Display Zoom on, put "ครับ" on a
      // line of its own.
      elSub.innerHTML='<span class="nb">ออกจากแอปได้</span> <span class="nb">เตรียมตัวให้พร้อมครับ</span>';
    }else if(p==='complete'){
      markDay(f.startsAt, true);         // she saw it through
      progress=1; done=true;
      elDoneSub.textContent='ครบ '+lenLabel(f.lenMins)+' แล้วครับ';
    }

    elWatch.hidden = p!=='armed';        // set, and waiting to begin

    // Backing out of the pickers leaves her on the opening screen, so that
    // screen has to lead back to a fast she already has. Otherwise it would be
    // stranded there until she closed the app.
    // Always "Start", never "Your fast". Backing out of Change lands her here
    // with the fast still set, and at that point the button is her way back to
    // it — but it should read the same as it always does.
    elStart.textContent = 'เริ่ม';

    // The one thing she actually wants to know while a fast is running.
    var running = p==='fasting';
    elEatBox.hidden = !running;
    elGive.hidden   = !running;
    if(running) elEatTime.textContent = labelDate(new Date(f.endsAt));

    // Her photos, small, under the fast — and under the wait as well, so the
    // two halves of this screen look like one place rather than a bare screen
    // that suddenly fills up the moment the clock starts.
    if(stripDirty) buildStrip();
    elStrip.hidden = !elStrip.children.length;

    var q = p==='fasting' ? currentQuote() : null;
    elQuote.hidden = !q;
    if(q) elQuote.textContent = '\u201C'+q+'\u201D';

    document.body.classList.toggle('done', done);
    elFill.style.strokeDashoffset = ARC*(1-progress);
  }

  wirePhotoTrack();

  // ---------- the strip under the timer ----------
  // Rebuilt only when the set of photos actually changes. The timer repaints
  // every second, and rebuilding here would throw away her place in the strip
  // once a second.
  var stripDirty=true;

  function buildStrip(){
    var out='';
    for(var i=0;i<photos.length;i++)
      out+='<img src="'+photos[i]+'" alt="" loading="lazy">';
    elStrip.innerHTML=out;
    stripDirty=false;
  }
  // A photo that will not load drops out of the strip rather than sitting there
  // as a broken box. Errors do not bubble, hence the capture phase.
  elStrip.addEventListener('error', function(e){
    if(e.target && e.target.tagName==='IMG') e.target.remove();
  }, true);

  // Tapping a photo opens it up, whole and full screen. The strip is scrolled
  // by swiping it; the tap is spent on the one thing she actually wants.
  elStrip.addEventListener('click', function(e){
    var img=e.target;
    if(!img || img.tagName!=='IMG') return;
    // Matched on the file rather than the position, because a photo that failed
    // to load has already been dropped from the strip and the two would differ.
    var i=photos.indexOf(img.getAttribute('src'));
    if(i<0) i=[].indexOf.call(elStrip.children, img);
    if(i>=0) openViewer(i);
  });

  // ---------- one photo, opened up ----------
  // Three gestures share this screen and have to be told apart: two fingers
  // pinch it larger, one finger drags it about once it is larger than the
  // screen, and one finger sideways moves to the next photo while it is not.
  // None of it is left to Safari, whose own pinch would zoom the black and the
  // cross along with the photo and would not hand it back when she let go.
  var viewAt=-1, vs=1, vtx=0, vty=0, vBase=null,
      vpts={}, vpinch=null, vpan=null;
  function viewerOpen(){ return !elViewer.hidden; }

  function applyView(snap){
    if(snap) elViewImg.classList.add('snap'); else elViewImg.classList.remove('snap');
    elViewImg.style.transform='translate('+vtx+'px,'+vty+'px) scale('+vs+')';
  }
  function resetView(snap){ vs=1; vtx=0; vty=0; applyView(snap); }
  // Where the photo lies when it is untouched — measured, not assumed. It is
  // letterboxed inside the padding, so its middle is not the middle of the
  // screen, and every limit below depends on where it actually is.
  function measureView(){
    var keep=elViewImg.style.transform;
    elViewImg.style.transform='none';
    var r=elViewImg.getBoundingClientRect();
    elViewImg.style.transform=keep;
    vBase = r.width ? {w:r.width, h:r.height,
                       cx:r.left+r.width/2, cy:r.top+r.height/2} : null;
  }
  // She must not be able to push the photo off the edge and lose it.
  function clampView(){
    if(!vBase) return;
    var vw=window.innerWidth, vh=window.innerHeight,
        w=vBase.w*vs, h=vBase.h*vs;
    if(w<=vw) vtx=0;
    else vtx=Math.max(vw-vBase.cx-w/2, Math.min(w/2-vBase.cx, vtx));
    if(h<=vh) vty=0;
    else vty=Math.max(vh-vBase.cy-h/2, Math.min(h/2-vBase.cy, vty));
  }
  function vmid(ids){
    var a=vpts[ids[0]], b=vpts[ids[1]];
    return {x:(a.x+b.x)/2, y:(a.y+b.y)/2,
            d:Math.max(1, Math.sqrt((b.x-a.x)*(b.x-a.x)+(b.y-a.y)*(b.y-a.y)))};
  }
  function paintViewDots(){
    if(photos.length<2){ elViewDots.hidden=true; return; }
    var out='';
    for(var i=0;i<photos.length;i++) out+='<i'+(i===viewAt?' class="on"':'')+'></i>';
    elViewDots.innerHTML=out; elViewDots.hidden=false;
  }
  function showInViewer(i){
    var n=photos.length; if(!n) return;
    viewAt=((i%n)+n)%n;
    vBase=null; resetView(false);      // a new photo always arrives whole
    elViewImg.src=photos[viewAt];
    paintViewDots();
  }
  elViewImg.addEventListener('load', measureView);
  window.addEventListener('resize', function(){
    if(!viewerOpen()) return;
    measureView(); clampView(); applyView(false);
  });
  function openViewer(i){
    if(!photos.length) return;
    showInViewer(i);
    elViewer.hidden=false;
    requestAnimationFrame(function(){ elViewer.classList.add('on'); });
  }
  function closeViewer(){
    if(!viewerOpen()) return;
    elViewer.classList.remove('on');
    setTimeout(function(){
      if(elViewer.classList.contains('on')) return;   // she opened it again in the meantime
      elViewer.hidden=true;
      elViewImg.removeAttribute('src');               // let go of the full-size image
      viewAt=-1; vBase=null; resetView(false);
    }, 240);
  }

  elViewer.addEventListener('pointerdown', function(e){
    if(elViewClose.contains(e.target)) return;        // the cross is a button
    vpts[e.pointerId]={x:e.clientX, y:e.clientY};
    try{ elViewer.setPointerCapture(e.pointerId); }catch(err){}
    var ids=Object.keys(vpts);
    if(ids.length===2){
      if(!vBase) measureView();
      if(!vBase) return;
      var m=vmid(ids);
      // Remember where the middle of her two fingers falls ON THE PHOTO, so
      // that spot stays under them however far apart she draws them.
      vpinch={d:m.d, s:vs, px:(m.x-vBase.cx-vtx)/vs, py:(m.y-vBase.cy-vty)/vs};
      vpan=null;
    } else if(ids.length===1){
      vpan={x:e.clientX, y:e.clientY, tx:vtx, ty:vty, moved:false};
    }
  });
  elViewer.addEventListener('pointermove', function(e){
    if(!vpts[e.pointerId]) return;
    vpts[e.pointerId]={x:e.clientX, y:e.clientY};
    var ids=Object.keys(vpts);
    if(vpinch && ids.length>=2 && vBase){
      var m=vmid(ids);
      vs=Math.max(1, Math.min(4, vpinch.s*(m.d/vpinch.d)));
      vtx=m.x-vBase.cx-vpinch.px*vs;
      vty=m.y-vBase.cy-vpinch.py*vs;
      clampView(); applyView(false);
    } else if(vpan && vs>1 && ids.length===1){
      vtx=vpan.tx+(e.clientX-vpan.x);
      vty=vpan.ty+(e.clientY-vpan.y);
      if(Math.abs(e.clientX-vpan.x)>4 || Math.abs(e.clientY-vpan.y)>4) vpan.moved=true;
      clampView(); applyView(false);
    }
  });
  function viewUp(e){
    if(!vpts[e.pointerId]) return;
    delete vpts[e.pointerId];
    var left=Object.keys(vpts).length;
    if(left<2) vpinch=null;
    if(left) return;
    var was=vpan; vpan=null;
    if(vs>1.02){
      if(was && was.moved) swipedAt=Date.now();   // a drag is not a tap
      return;
    }
    if(vs!==1){ resetView(true); return; }        // barely pinched, settle back
    if(!was) return;                              // the tail of a pinch
    var dx=e.clientX-was.x, dy=e.clientY-was.y;
    if(Math.abs(dx)<45 || Math.abs(dx)<Math.abs(dy)*1.5) return;
    swipedAt=Date.now();
    showInViewer(viewAt + (dx<0 ? 1 : -1));
  }
  elViewer.addEventListener('pointerup', viewUp);
  elViewer.addEventListener('pointercancel', viewUp);

  // Every way out is a tap: the cross, or anywhere on the photo. While it is
  // zoomed in, that first tap gives her the whole photo back rather than
  // closing it, so she cannot get stranded in a corner of one.
  elViewer.addEventListener('click', function(){
    if(vs>1.02){ resetView(true); return; }
    closeViewer();
  });
  elViewClose.addEventListener('click', function(e){
    e.stopPropagation(); closeViewer();            // the cross always means out
  });

  // ---------- settings ----------
  function renderMine(){
    var out='';
    for(var i=0;i<mine.length;i++)
      out+='<div class="thumb"><img src="'+mine[i].url+'" alt="">'
         + '<button class="x" type="button" data-id="'+mine[i].id+'" aria-label="เอารูปออก">\u00D7</button></div>';
    elMineGrid.innerHTML=out;
    elMineGrid.hidden = !mine.length;
  }
  function setHint(){
    elSetHint.textContent = mine.length
      ? 'รูปที่เพิ่มไว้จะขึ้นที่หน้าแรกครับ กด \u00D7 เพื่อเอาออก'
      : 'เพิ่มรูปของตัวเองได้ครับ รูปจะขึ้นที่หน้าแรก';
  }
  elMineGrid.addEventListener('click', function(e){
    var b=e.target.closest ? e.target.closest('.x') : null;
    if(!b) return;
    var id=b.getAttribute('data-id');
    delPhoto(id, function(){
      for(var i=0;i<mine.length;i++) if(mine[i].id===id){
        try{ URL.revokeObjectURL(mine[i].url); }catch(e2){}
        mine.splice(i,1); break;
      }
      rebuildPhotos();
      photoAt=-1;                      // whatever was on screen may have been it
      renderMine(); setHint(); paintDots(); render();
    });
  });

  document.getElementById('btnCog').addEventListener('click', function(){ go('pgSet'); });
  document.getElementById('setBack').addEventListener('click', function(){ go('pgHome'); });
  document.getElementById('btnAdd').addEventListener('click', function(){ elPick.click(); });
  elPick.addEventListener('change', function(){
    var files=elPick.files;
    if(!files || !files.length) return;
    elSetHint.textContent='กำลังเพิ่ม\u2026';
    importFiles(files, function(added, tried){
      elPick.value='';                 // so picking the same photo again still fires
      rebuildPhotos();
      renderMine(); paintDots(); render();
      // One line where English needed two: Thai does not inflect for number.
      if(added===tried && added) elSetHint.textContent = 'เพิ่มรูปแล้ว '+added+' รูป';
      else if(added)             elSetHint.textContent = 'เพิ่มได้ '+added+' จาก '+tried+' รูป ที่เหลืออ่านไม่ได้ครับ';
      else                       elSetHint.textContent = 'เพิ่มรูปนี้ไม่ได้ครับ ลองรูปอื่นดูนะครับ';
    });
  });

  // ---------- calendar ----------
  var calCursor=null;                    // first of the month on show

  (function buildDow(){
    var names=['จ','อ','พ','พฤ','ศ','ส','อา'], out='';
    for(var i=0;i<7;i++) out+='<span class="dow">'+names[i]+'</span>';
    document.getElementById('calDow').innerHTML=out;
  })();

  function renderCal(){
    var now=dayDate(Date.now());                     // the day she is on, by that border
    if(!calCursor) calCursor=new Date(now.getFullYear(), now.getMonth(), 1);
    var y=calCursor.getFullYear(), m=calCursor.getMonth();

    // th-TH carries the Buddhist year with it, which is the year she counts in.
    elCalMonth.textContent = calCursor.toLocaleDateString('th-TH',{month:'long', year:'numeric'});

    var lead=(new Date(y,m,1).getDay()+6)%7;        // weeks start Monday
    var days=new Date(y,m+1,0).getDate();
    var todayKey=dayKey(Date.now()), out='';

    for(var i=0;i<lead;i++) out+='<span class="day blank"></span>';
    for(var d=1;d<=days;d++){
      var k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var v=state.log[k], c='day';
      if(v===true) c+=' done'; else if(v===false) c+=' miss';
      if(k===todayKey) c+=' today';
      out+='<span class="'+c+'">'+d+'</span>';
    }
    elCalGrid.innerHTML=out;
    elCalNext.disabled = (y>now.getFullYear() || (y===now.getFullYear() && m>=now.getMonth()));
  }

  function stepMonth(n){
    calCursor=new Date(calCursor.getFullYear(), calCursor.getMonth()+n, 1);
    renderCal();
  }
  document.getElementById('calPrev').addEventListener('click', function(){ stepMonth(-1); });
  elCalNext.addEventListener('click', function(){ if(!elCalNext.disabled) stepMonth(1); });

  // ---------- page transitions ----------
  // Where the app belongs right now. A finished fast owes her the reward screen
  // and keeps owing it until she has actually seen it and pressed Done, so it
  // survives being closed, and being left alone for days.
  function openPage(){
    if(!state.fast)        return 'pgHome';
    if(phase()==='complete') return 'pgDone';
    return 'pgTimer';
  }

  var cur=null;
  function onShow(pg){
    if(pg.id==='pgLength') syncLen();        // display:none loses scrollTop
    if(pg.id==='pgTime')   syncStart();
    if(pg.id==='pgTimer'){ endConfirm(); elStrip.scrollLeft=0; }   // display:none loses it too
    if(pg.id==='pgSet'){ renderMine(); setHint(); }
    if(pg.id==='pgHome' && photosReady) showPhoto(photoIdx());
    if(pg.id==='pgCal'){ calCursor=null; renderCal(); }   // always opens on this month
    if(pg.id==='pgDone'){                                 // draw the tick again
      var m=pg.querySelector('.tick-mark');
      m.style.animation='none'; void m.offsetWidth; m.style.animation='';
    }
  }
  function go(id){
    var next=document.getElementById(id);
    if(next===cur) return;
    var prev=cur; cur=next;
    document.body.classList.toggle('landing', id==='pgHome');
    document.body.classList.toggle('timer', id==='pgTimer');
    function show(){
      next.hidden=false; onShow(next);
      requestAnimationFrame(function(){ next.classList.add('on'); });
    }
    if(!prev){ show(); return; }
    prev.classList.remove('on');
    setTimeout(function(){ prev.hidden=true; show(); }, 260);
  }

  function swap(hide, show){
    hide.hidden=true; show.hidden=false;
    show.classList.remove('swapin'); void show.offsetWidth; show.classList.add('swapin');
  }
  function endConfirm(){
    if(elConfirm.hidden) return;
    elConfirm.hidden=true; elChangeRow.hidden=false;
  }

  elStart.addEventListener('click', function(){
    go(state.fast ? openPage() : 'pgLength');
  });
  // The calendar is now reachable from two places, so Back has to return to
  // whichever one she came from rather than always to the opening screen.
  var calFrom='pgHome';
  document.getElementById('btnCal').addEventListener('click', function(){ calFrom='pgHome'; go('pgCal'); });
  document.getElementById('btnCalTop').addEventListener('click', function(){ calFrom='pgTimer'; go('pgCal'); });
  document.getElementById('calBack').addEventListener('click', function(){ go(calFrom); });
  document.getElementById('btnNext').addEventListener('click', function(){ go('pgTime'); });
  document.getElementById('btnBack').addEventListener('click', function(){ go('pgLength'); });
  document.getElementById('btnLenBack').addEventListener('click', function(){ go('pgLength'); });
  // Back always steps back along the flow — landing, length, start time — and
  // never sideways into whatever the app happens to be doing.
  elCancel.addEventListener('click', function(){ go('pgHome'); });
  document.getElementById('btnDone').addEventListener('click', function(){
    state.fast=null; save(); render();   // the reward is spent; the day keeps its mark
    go('pgHome');
  });
  // Owning up after the fact. She is not questioned or deterred for it — the
  // fast simply stops counting and the day goes back to blank, as though she
  // had never set it. Honesty should cost her nothing but the tick.
  document.getElementById('btnBroke').addEventListener('click', function(){
    if(state.fast) unmarkDay(state.fast.startsAt);
    state.fast=null; save(); render();
    go('pgHome');
  });

  // Changing a fast she has already committed to should take a second thought.
  // A finished fast never reaches this screen, so there is no case for it here.
  var confirmWhat=null;
  elChange.addEventListener('click', function(){
    var p=phase(), f=state.fast;
    confirmWhat='change';
    elAsk.textContent = p==='fasting'
      ? 'ทำได้ '+durText(Date.now()-f.startsAt)+' แล้ว ต้องการจะเปลี่ยนใช่ไหมครับ'
      : 'กำลังจะเริ่มเมื่อ '+labelDate(new Date(f.startsAt))+' ต้องการจะเปลี่ยนใช่ไหมครับ';
    elYes.textContent='ใช่ เปลี่ยน';
    swap(elChangeRow, elConfirm);
  });

  // Giving up stops the fast there and then, and the day is marked as a miss.
  // It asks the same question first, for the same reason Change does.
  elGive.addEventListener('click', function(){
    var f=state.fast;
    if(phase()!=='fasting') return;
    confirmWhat='giveup';
    elAsk.textContent='เริ่มมา '+durText(Date.now()-f.startsAt)+' แล้ว จะหยุดเลยไหมครับ';
    elYes.textContent='ใช่ ยอมแพ้';
    swap(elChangeRow, elConfirm);
  });
  document.getElementById('btnKeep').addEventListener('click', function(){
    swap(elConfirm, elChangeRow);
  });
  elYes.addEventListener('click', function(){
    endConfirm();
    if(confirmWhat==='giveup'){
      if(phase()!=='fasting'){ render(); return; }   // it finished while she hesitated
      markDay(state.fast.startsAt, false);
      state.fast=null; save(); render();
      go('pgHome');
      return;
    }
    go('pgLength');
  });

  // Set commits one fast. If that start time has already been and gone by more
  // than the length, she means the next one; otherwise the fast is underway.
  document.getElementById('btnSet').addEventListener('click', function(){
    // Replacing a fast that was already under way is a miss. Replacing one that
    // had not started yet is just her changing her mind, and counts for nothing.
    var old=state.fast, t=Date.now();
    if(old && t>=old.startsAt && t<old.endsAt) markDay(old.startsAt, false);

    var dur=state.draftLen*60000;
    var now=new Date(), s=toMins(state.draftStart);
    var st=new Date(now); st.setHours(Math.floor(s/60), s%60, 0, 0);
    if(st.getTime() > now.getTime()) st.setDate(st.getDate()-1);   // most recent occurrence
    if(now.getTime() >= st.getTime()+dur){                          // that one is already over
      st=new Date(now); st.setHours(Math.floor(s/60), s%60, 0, 0);
      if(st.getTime() <= now.getTime()) st.setDate(st.getDate()+1); // so use the upcoming one
    }
    state.fast={ startsAt:st.getTime(), endsAt:st.getTime()+dur,
                 startHHMM:state.draftStart, lenMins:state.draftLen };
    save(); render(); go('pgTimer');
  });

  // Repaint only. Elapsed is always derived from the stored timestamps, so the
  // fast begins on its own and a suspended app catches up when reopened.
  setInterval(function(){
    if(!state.fast) return;
    render();
    // The moment it finishes, if she is watching, she gets the tick.
    if(phase()==='complete' && cur && cur.id==='pgTimer') go('pgDone');
  }, 1000);
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) return;
    rollQuote();                       // a fresh line every time she comes back
    rollPhoto();                       // and a different photo behind it
    if(document.body.classList.contains('landing')) showPhoto(photoIdx());
    render();
    if(phase()==='complete' && cur && (cur.id==='pgTimer' || cur.id==='pgHome')) go('pgDone');
  });

  rollQuote();                         // and a fresh line on every cold start
  render();
  go(openPage());
  if(migrated) save();

  // Her own photos come off the phone's disk, so they land a moment after the
  // rest of the app. The opening photo waits for them — otherwise the ones she
  // added herself could never be the one she is greeted with, only something
  // she had to swipe to find. The timeout is a backstop: if the store never
  // answers, the app carries on with the photos it shipped with rather than
  // sitting on a blank screen.
  var settled=false;
  function photosIn(){
    if(settled) return;
    settled=true; photosReady=true;
    rebuildPhotos();
    rollPhoto();                       // never the photo she saw last time
    if(document.body.classList.contains('landing')) showPhoto(photoIdx());
    paintDots();
  }
  setTimeout(photosIn, 1500);
  loadMine(photosIn);

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js'); });
  }
})();
</script>
</body>
</html>
